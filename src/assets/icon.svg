<!--
  KingProgress mark: the King crown above a progress ring.
  Source for icon.png and icons.icns. Render at 1024x1024, then:
     sips -z <size> <size> icon.png --out <iconset>/... ; iconutil -c icns
-->
<svg width="512" height="512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#273546"/>
      <stop offset="55%" stop-color="#161d27"/>
      <stop offset="100%" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#7cc4ff"/>
      <stop offset="55%"  stop-color="#4b93ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- squircle plate -->
  <g filter="url(#drop)">
    <rect x="100" y="92" width="824" height="824" rx="188" fill="url(#plate)"/>
    <rect x="100" y="92" width="824" height="824" rx="188" fill="url(#sheen)"/>
    <rect x="101.5" y="93.5" width="821" height="821" rx="186.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <g transform="translate(176 154) scale(28)" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="m6 3.25 3.25 2L12 1.75l2.75 3.5 3.25-2-1.25 4.5h-9.5Z" fill="url(#arc)"/>
    <path d="M17.75 9.5a7.5 7.5 0 1 1-11.5 0" stroke="#ffffff" stroke-opacity="0.16"/>
    <path d="M17.75 9.5a7.5 7.5 0 1 1-11.5 0" stroke="url(#arc)" pathLength="100" stroke-dasharray="72 100"/>
  </g>
</svg>
